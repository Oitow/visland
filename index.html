<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Visland</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* One screen: the island fills it; a glass panel of deep sea sits over it for the title, small chips for the HUD. */
  :root {
    --sea: #0a1e28; /* deep water, the panels' ground */
    --glass: rgba(9, 28, 38, 0.74);
    --foam: #eaf5f1; /* text */
    --mist: #9fbcbd; /* quiet text */
    --sand: #e6d29a; /* the main action */
    --crystal: #8ef0ff; /* crystals and focus */
    --line: rgba(234, 245, 241, 0.16);
    --ui: ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, sans-serif;
    --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--sea);
    color: var(--foam);
    font: 15px/1.45 var(--ui);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; }
  body > canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--crystal); outline-offset: 2px; }
  .hidden { display: none !important; }

  /* the title */
  #menu {
    position: fixed; inset: 0; z-index: 30;
    display: grid; place-items: end start;
    padding-block: max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: linear-gradient(to top, rgba(6, 18, 26, 0.7), rgba(6, 18, 26, 0) 60%);
  }
  .panel {
    width: min(420px, 100%);
    display: grid; gap: 14px;
    padding: 22px;
    background: var(--glass);
    border: 1px solid var(--line);
    border-radius: 6px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  #logo { width: 100%; max-width: 100%; height: auto; image-rendering: pixelated; }
  .tag { margin: 0; color: var(--mist); text-wrap: balance; }
  label { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mist); }
  .seedrow { display: flex; gap: 8px; }
  #seed {
    flex: 1; min-width: 0;
    padding: 10px 12px;
    font: 16px var(--mono);
    color: var(--foam); background: rgba(0, 0, 0, 0.3);
    border: 1px solid var(--line); border-radius: 4px;
    user-select: text; -webkit-user-select: text;
  }
  #dice { width: 46px; border: 1px solid var(--line); border-radius: 4px; background: rgba(0, 0, 0, 0.3); font-size: 20px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .primary {
    flex: 1;
    padding: 12px 16px;
    border: 0; border-radius: 4px;
    background: var(--sand); color: var(--sea);
    font-weight: 700; letter-spacing: 0.02em;
    box-shadow: 0 3px 0 #a99460;
  }
  .primary:active { transform: translateY(2px); box-shadow: 0 1px 0 #a99460; }
  .secondary { padding: 12px 16px; border: 1px solid var(--line); border-radius: 4px; background: transparent; }
  .note { margin: 0; font-size: 12px; color: var(--mist); }
  #loading { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; font: 14px var(--mono); color: var(--crystal); pointer-events: none; }

  /* the HUD */
  #hud { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
  .top {
    position: absolute; left: 0; right: 0; top: 0;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding-top: calc(10px + env(safe-area-inset-top, 0px));
    padding-left: max(12px, env(safe-area-inset-left, 0px));
    padding-right: max(12px, env(safe-area-inset-right, 0px));
  }
  .chips { display: flex; gap: 6px; align-items: center; min-width: 0; }
  .chip {
    padding: 5px 10px;
    background: var(--glass); border: 1px solid var(--line); border-radius: 4px;
    font: 13px var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  #seedLabel { overflow: hidden; text-overflow: ellipsis; max-width: 40vw; }
  #crystals { color: var(--crystal); }
  #menuBtn { pointer-events: auto; padding: 5px 11px; font-size: 16px; }
  #cross { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; }
  #cross::before, #cross::after { content: ''; position: absolute; background: rgba(255, 255, 255, 0.85); mix-blend-mode: difference; }
  #cross::before { left: 8px; top: 0; width: 2px; height: 18px; }
  #cross::after { top: 8px; left: 0; height: 2px; width: 18px; }
  #toast, #blockName, #help {
    position: absolute; left: 50%; transform: translateX(-50%);
    max-width: calc(100% - 32px); text-align: center; text-wrap: balance;
    opacity: 0; transition: opacity 0.3s;
  }
  #toast { top: calc(60px + env(safe-area-inset-top, 0px)); padding: 8px 14px; background: var(--glass); border: 1px solid var(--line); border-radius: 4px; }
  #blockName { bottom: calc(86px + env(safe-area-inset-bottom, 0px)); font: 13px var(--mono); text-shadow: 0 1px 2px #000; }
  #help { top: calc(64px + env(safe-area-inset-top, 0px)); font-size: 13px; color: var(--mist); text-shadow: 0 1px 2px #000; }
  .on { opacity: 1 !important; }
  #underwater { position: absolute; inset: 0; background: rgba(10, 70, 90, 0.35); opacity: 0; transition: opacity 0.2s; }
  #hotbar {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    display: flex; gap: 4px; padding: 4px;
    max-width: calc(100% - 32px); overflow-x: auto;
    background: var(--glass); border: 1px solid var(--line); border-radius: 6px;
    pointer-events: auto; scrollbar-width: none;
  }
  .slot {
    position: relative; flex: none;
    width: 52px; height: 52px; padding: 0;
    display: grid; place-items: center;
    background: rgba(0, 0, 0, 0.25); border: 2px solid transparent; border-radius: 4px;
  }
  .slot.sel { border-color: var(--sand); background: rgba(230, 210, 154, 0.14); }
  .slot.empty canvas { opacity: 0.3; }
  .slot span { position: absolute; right: 4px; bottom: 1px; font: 11px var(--mono); text-shadow: 0 1px 1px #000; }

  /* touch controls */
  #touchLayer { position: fixed; inset: 0; z-index: 5; display: none; }
  .touch #touchLayer { display: block; }
  .ring { position: fixed; left: 0; top: 0; border-radius: 50%; opacity: 0; pointer-events: none; z-index: 6; transition: opacity 0.15s; }
  #stickBase { width: 112px; height: 112px; border: 2px solid rgba(255, 255, 255, 0.35); background: rgba(0, 0, 0, 0.15); }
  #stickKnob { width: 48px; height: 48px; background: rgba(255, 255, 255, 0.45); }
  .buttons {
    position: absolute; display: none;
    right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(92px + env(safe-area-inset-bottom, 0px));
    grid-template-columns: 64px 64px; gap: 10px; pointer-events: auto;
  }
  .touch .buttons { display: grid; }
  .buttons button {
    width: 64px; height: 64px; border-radius: 50%;
    background: var(--glass); border: 1px solid var(--line);
    font-size: 24px; touch-action: none;
  }
  .buttons button.down { background: rgba(230, 210, 154, 0.35); }
  #btnJump { grid-column: 2; }
  .touch #cross { width: 14px; height: 14px; }
  @media (prefers-reduced-motion: reduce) { #toast, #blockName, #help, .ring { transition: none; } }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="menu">
  <div class="panel">
    <canvas id="logo" width="240" height="52" aria-label="Visland"></canvas>
    <p class="tag">Jede Insel wächst aus einem Seed, ganz ohne Bilder: Land, Bäume, Himmel, Texturen und Klang entstehen im Code.</p>
    <label for="seed">Seed der Insel</label>
    <div class="seedrow">
      <input id="seed" autocomplete="off" spellcheck="false" maxlength="40">
      <button id="dice" title="Neuer Seed" aria-label="Neuer Seed">⚄</button>
    </div>
    <div class="actions">
      <button id="play" class="primary">Insel betreten</button>
      <button id="resume" class="secondary hidden">Weiterspielen</button>
    </div>
    <p class="note">Gleicher Seed, gleiche Insel. Deine Bauten werden in diesem Browser gespeichert.</p>
  </div>
</div>
<div id="loading" class="hidden">Insel wächst …</div>

<div id="touchLayer"></div>
<div id="stickBase" class="ring"></div>
<div id="stickKnob" class="ring"></div>

<div id="hud" class="hidden">
  <div id="underwater"></div>
  <div class="top">
    <div class="chips">
      <button id="menuBtn" class="chip" aria-label="Menü">☰</button>
      <span id="seedLabel" class="chip"></span>
    </div>
    <div class="chips">
      <span id="crystals" class="chip">◆ 0/8</span>
      <span id="clock" class="chip">☀ 07:12</span>
    </div>
  </div>
  <div id="cross"></div>
  <div id="toast"></div>
  <div id="help"></div>
  <div id="blockName"></div>
  <div class="buttons">
    <button id="btnDig" aria-label="Abbauen">⛏</button>
    <button id="btnBuild" aria-label="Bauen">▣</button>
    <button id="btnJump" aria-label="Springen">⤒</button>
  </div>
  <div id="hotbar"></div>
</div>

<script type="module" src="./src/logo.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
